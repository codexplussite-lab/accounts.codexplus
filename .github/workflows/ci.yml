name: Accounting ERP CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-validation:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Backend Vitest Test Suite
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: "mysql://test:test@127.0.0.1:3306/test_db"
          JWT_ACCESS_SECRET: "test-access-secret-key-at-least-32-characters-long"
          JWT_REFRESH_SECRET: "test-refresh-secret-key-at-least-32-characters-long"
          CORS_ORIGIN: "http://localhost:3000"

      - name: Compile Backend TypeScript
        run: npm run build

  frontend-validation:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
